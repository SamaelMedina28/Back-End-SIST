services:
  postgres:
    image: postgres:18.6-alpine
    container_name: sist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_system
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: development_password
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d support_system"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
